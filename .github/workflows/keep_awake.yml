name: Keep Render Backend Awake

on:
  schedule:
    - cron: '*/12 * * * *'  # Runs every 12 minutes
  workflow_dispatch:        # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -I -s -o /dev/null -w "%{http_code}" https://voice-ai-backend-yk1m.onrender.com/health
